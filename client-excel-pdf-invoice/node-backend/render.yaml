services:
  - type: web
    name: invoicevault-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PYTHON_PARSER_URL
        sync: false
      - key: PORT
        value: 3000
